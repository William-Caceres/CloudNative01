spring.application.name=servicio

# Configuracion de BDD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:h_servicio}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Puerto de la API
server.port=${SERVER_PORT:8082}

# Seguridad OAuth2 Resource Server (JWT de Azure Entra ID)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:e34a6311-e69d-4a97-bedf-2ad7cc5455a0}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AUDIENCE:46cda96c-1ab7-42af-a838-5ad46de31226}

# RabbitMQ: conexion del productor de eventos (la topologia la declara unicamente rabbit-admin)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Nombres de mensajeria usados por el productor
hotel.mensajeria.exchanges.topic=hotel.topic
hotel.mensajeria.routing.servicioActualizado=servicio.actualizado

# Publisher confirms + returns: el broker confirma, las devoluciones las registra
# PublicacionObservable
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
