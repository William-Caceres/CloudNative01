spring:
  application:
    name: broker-admin

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:h_broker_admin}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

  # Seguridad OAuth2 Resource Server (JWT de Microsoft Entra ID)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:e34a6311-e69d-4a97-bedf-2ad7cc5455a0}/v2.0
          audiences: ${AZURE_AUDIENCE:46cda96c-1ab7-42af-a838-5ad46de31226}

  # Conexion a RabbitMQ (en la nube se sobreescribe por variables de entorno)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        # ACK manual: el consumidor confirma o deriva a DLQ segun el resultado
        acknowledge-mode: manual
        prefetch: 1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.block.ms: 5000

server:
  port: ${SERVER_PORT:8085}

# Nombres centralizados de la mensajeria: en el codigo solo se referencian estas llaves
hotel:
  mensajeria:
    exchanges:
      topic: hotel.topic
      direct: hotel.direct
      dlx: hotel.dlx
    colas:
      notificaciones: notificaciones.queue
      tickets: tickets.queue
      documentos: documentos.queue
    dlq:
      notificaciones: notificaciones.dlq
      tickets: tickets.dlq
      documentos: documentos.dlq
    routing:
      reservaTodos: reserva.*
      reservaCreada: reserva.creada
      servicioTodos: servicio.*
      ticketDirecto: ticket.generar
  kafka:
    topics:
      reservas: reservas
      pagos: pagos
      reservas-dlt: reservas.DLT
      pagos-dlt: pagos.DLT
    crear-topicos: true
    consumidores-activos: true
