# Persistencia de prueba: H2 en memoria
spring.datasource.url=jdbc:h2:mem:broker_admin_integration;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Broker local de auditoria (contenedor cn-rabbit-audit: 5680/15680, usuario hotel)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5680
spring.rabbitmq.username=hotel
spring.rabbitmq.password=hotel123

# Seguridad OAuth2 (issuer ficticio, no hay llamadas reales a Entra en estos tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999

# Esta suite SI declara la topologia al arrancar (es lo que se quiere verificar)
hotel.mensajeria.declarar-al-inicio=true
hotel.kafka.crear-topicos=false
hotel.kafka.consumidores-activos=false

# El broker local de pruebas es de un solo nodo.
hotel.mensajeria.quorum-size=1
