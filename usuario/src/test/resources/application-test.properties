spring.datasource.url=jdbc:h2:mem:usuario_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Seguridad OAuth2 (issuer ficticio solo para inicializar el decoder en test)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999
