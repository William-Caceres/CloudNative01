# Cluster RabbitMQ R2: un contenedor por EC2, tres nodos en total.
# Cada host usa RABBIT_NODE=rabbit1|rabbit2|rabbit3 y las IPs privadas del cluster.
name: hotel-rabbit

services:
  rabbit:
    image: rabbitmq:4.2-management
    container_name: ${RABBIT_NODE:?falta RABBIT_NODE}
    hostname: ${RABBIT_NODE:?falta RABBIT_NODE}
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBIT_COOKIE:?falta en .env}
      RABBITMQ_NODENAME: rabbit@${RABBIT_NODE:?falta RABBIT_NODE}
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?falta en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?falta en .env}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "4369:4369"
      - "25672:25672"
    extra_hosts:
      - "rabbit1:${RABBIT1_IP:?falta RABBIT1_IP}"
      - "rabbit2:${RABBIT2_IP:?falta RABBIT2_IP}"
      - "rabbit3:${RABBIT3_IP:?falta RABBIT3_IP}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  rabbit-data:
